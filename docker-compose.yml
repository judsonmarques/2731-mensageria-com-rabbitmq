version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3.10-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./dados:/var/lib/rabbitmq/

  mysql:
    image: mysql:latest
    container_name: mysql-alurafood
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
